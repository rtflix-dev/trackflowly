<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TrackFlowly | Admin Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--fg:#000;--card:#fff;--mut:#667085;--line:#e9e9ec;--soft:#f4f5f7;--btn:#000;--btnfg:#fff;--danger:#ef4444;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--fg:#fff;--card:#111;--mut:#9aa0ab;--line:#24262b;--soft:#1a1b1f;--btn:#fff;--btnfg:#000}}
:root[data-theme="dark"]{--bg:#000;--fg:#fff;--card:#111;--mut:#9aa0ab;--line:#24262b;--soft:#1a1b1f;--btn:#fff;--btnfg:#000}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Poppins,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #4e8df5;outline-offset:2px}

.bar{background:#000;color:#fff;overflow:hidden;white-space:nowrap;font-size:13px;font-weight:500;padding:11px 0}
.mq{display:inline-block;animation:mq 30s linear infinite}
.mq span{padding:0 26px}
@keyframes mq{to{transform:translateX(-50%)}}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:12px 20px}
.logo{font-weight:800;font-size:24px;letter-spacing:-.085em;text-transform:uppercase}
.badge-admin{background:var(--btn);color:var(--btnfg);font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;letter-spacing:0.05em;text-transform:uppercase}

main{max-width:1150px;margin:0 auto;padding:32px 16px 60px}
h1.t{font-size:clamp(28px,6vw,40px);font-weight:800;margin:0 0 8px;text-align:center}
.sub{text-align:center;color:var(--mut);font-size:14px;margin:0 0 32px}

/* Admin Auth Overlay */
.auth-overlay{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
.auth-card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:36px 28px;width:100%;max-width:400px;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.08)}
.auth-card h2{margin:0 0 8px;font-weight:800;font-size:24px}
.auth-card p{margin:0 0 24px;color:var(--mut);font-size:14px}
.auth-card input{text-align:center;font-weight:700;letter-spacing:2px;font-size:16px;text-transform:uppercase}
.auth-error{color:var(--danger);font-size:13px;margin-top:10px;font-weight:500}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-bottom:36px}
.scard{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.04)}
.scard h3{margin:0 0 6px;font-size:13px;color:var(--mut);font-weight:500;text-transform:uppercase;letter-spacing:0.05em}
.scard .val{font-size:28px;font-weight:800}

/* Actions & Panels */
.panel{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px;margin-bottom:32px;box-shadow:0 8px 30px rgba(0,0,0,.04)}
.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:12px}
.panel-head h2{font-size:20px;font-weight:800;margin:0}

.b1,.b2{padding:12px 20px;font-size:14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:30px;transition:0.2s}
.b1{border:2px solid var(--fg)}
.b2{background:var(--btn);color:var(--btnfg)}
.b-danger{background:var(--danger);color:#fff}
.b-sm{padding:8px 14px;font-size:12px;border-radius:20px}

/* Form inputs */
.form-grid{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:600px){.form-grid{grid-template-columns:1fr 1fr}}
label{display:block;font-size:12px;font-weight:600;color:var(--mut);margin:8px 0 4px}
input,select,textarea{width:100%;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--soft);color:var(--fg);font:inherit;font-size:14px}

/* Product Cards Grid in Admin */
.admin-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.acard{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:10px;position:relative}
.acard .art{height:100px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:12px;color:#10213d}
.acard h4{margin:0;font-size:16px;font-weight:600}
.acard .p-meta{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:600;margin-top:auto}
.acard .btns{display:flex;gap:8px;margin-top:10px}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translate(-50%,16px);background:var(--btn);color:var(--btnfg);padding:12px 18px;border-radius:12px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:60}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>

<!-- Login Modal -->
<div class="auth-overlay" id="authOverlay">
  <div class="auth-card">
    <h2>Admin Access</h2>
    <p>Please enter the secret code to access the admin dashboard.</p>
    <form id="authForm">
      <input type="password" id="authCode" placeholder="Enter Secret Code" required autocomplete="current-password">
      <button type="submit" class="b2" style="width:100%;margin-top:14px">Login</button>
      <div class="auth-error" id="authError" hidden>Incorrect passcode. Please try again.</div>
    </form>
  </div>
</div>

<div class="bar"><div class="mq" data-t="⚡ TrackFlowly Admin Dashboard • Manage products & store settings"></div></div>

<header>
  <a class="logo" href="#">TrackFlowly</a>
  <div style="display:flex;align-items:center;gap:10px">
    <span class="badge-admin">Admin Panel</span>
    <button class="b1 b-sm" onclick="logoutAdmin()">Logout</button>
  </div>
</header>

<main>
  <h1 class="t">STORE MANAGER</h1>
  <p class="sub">Add, edit, and control products for TrackFlowly store.</p>

  <!-- Quick Stats -->
  <div class="stats">
    <div class="scard"><h3>Total Products</h3><div class="val" id="st-count">0</div></div>
    <div class="scard"><h3>Avg. Price</h3><div class="val" id="st-avg">$0.00</div></div>
    <div class="scard"><h3>Categories</h3><div class="val">3</div></div>
  </div>

  <!-- Product Add/Edit Panel -->
  <section class="panel">
    <div class="panel-head">
      <h2 id="form-title">Add New Product</h2>
      <button class="b1 b-sm" id="btn-reset" onclick="resetForm()">Clear Form</button>
    </div>
    
    <form id="p-form">
      <input type="hidden" id="p-id">
      <div class="form-grid">
        <div>
          <label for="p-n">Product Title</label>
          <input id="p-n" placeholder="e.g. Daily Habit Tracker" required>
        </div>
        <div>
          <label for="p-p">Price ($)</label>
          <input id="p-p" type="number" step="0.01" placeholder="4.00" required>
        </div>
        <div>
          <label for="p-c">Category</label>
          <select id="p-c">
            <option value="habits">Habit trackers</option>
            <option value="planning">Planners</option>
            <option value="focus">Focus</option>
          </select>
        </div>
        <div>
          <label for="p-tag">Badge Tag (Optional)</label>
          <input id="p-tag" placeholder="e.g. Best seller">
        </div>
      </div>

      <div style="margin-top:14px">
        <label for="p-d">Description</label>
        <textarea id="p-d" rows="3" placeholder="A simple layout to keep your routines in sight." required></textarea>
      </div>

      <div style="margin-top:20px">
        <button class="b2" type="submit" id="btn-submit" style="width:100%">Save Product</button>
      </div>
    </form>
  </section>

  <!-- Products List Panel -->
  <section class="panel">
    <div class="panel-head">
      <h2>Active Products</h2>
      <button class="b1 b-sm" onclick="exportJSON()">Export JSON Data</button>
    </div>
    <div class="admin-grid" id="admin-grid"></div>
  </section>
</main>

<div class="toast" id="toast"></div>

<script>
const SECRET_CODE = "TRACK2030";
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);

/* Authentication Check */
function checkAuth() {
  const isAuth = sessionStorage.getItem("tf_admin_auth") === "true";
  if (isAuth) {
    $("#authOverlay").hidden = true;
  } else {
    $("#authOverlay").hidden = false;
  }
}

$("#authForm").onsubmit = e => {
  e.preventDefault();
  const input = $("#authCode").value.trim();
  if (input === SECRET_CODE) {
    sessionStorage.setItem("tf_admin_auth", "true");
    $("#authError").hidden = true;
    checkAuth();
    toast("Welcome back, Admin!");
  } else {
    $("#authError").hidden = false;
    $("#authCode").value = "";
    $("#authCode").focus();
  }
};

function logoutAdmin() {
  sessionStorage.removeItem("tf_admin_auth");
  checkAuth();
}

/* Default Store Data */
let P = [
  { id: 1, n: "Daily Habit Tracker", c: "habits", p: 4, d: "A simple layout to keep your routines in sight.", tag: "Best start", bg: "#eaf1ff" },
  { id: 2, n: "Weekly Planner", c: "planning", p: 5, d: "Map out priorities and make room for what matters.", bg: "#e7f8f1" },
  { id: 3, n: "Focus Session Sheet", c: "focus", p: 3, d: "A distraction-light page for your next task.", bg: "#fff2e5" },
  { id: 4, n: "Monthly Reset Kit", c: "planning", p: 6, d: "Review your month and set your next intentions.", bg: "#f3ebff" }
];

/* Marquee setup */
$$(".mq").forEach(m => m.innerHTML = ("<span>" + m.dataset.t + "</span>").repeat(12));

function toast(m) {
  const t = $("#toast");
  t.textContent = m; t.classList.add("on");
  setTimeout(() => t.classList.remove("on"), 2200);
}

function render() {
  const grid = $("#admin-grid");
  grid.innerHTML = P.map(p => `
    <article class="acard">
      <div class="art" style="background:${p.bg || '#f4f5f7'}">${p.n.toUpperCase()}</div>
      <h4>${p.n}</h4>
      <p style="font-size:12px;color:var(--mut);margin:0">${p.d}</p>
      <div class="p-meta">
        <span>$${p.p.toFixed(2)}</span>
        <small style="color:var(--mut);font-weight:400">${p.c}</small>
      </div>
      <div class="btns">
        <button class="b1 b-sm" style="flex:1" onclick="editP(${p.id})">Edit</button>
        <button class="b2 b-sm b-danger" onclick="deleteP(${p.id})">Delete</button>
      </div>
    </article>
  `).join("");

  /* Update stats */
  $("#st-count").textContent = P.length;
  const avg = P.length ? (P.reduce((s, x) => s + x.p, 0) / P.length).toFixed(2) : "0.00";
  $("#st-avg").textContent = "$" + avg;
}

function resetForm() {
  $("#p-id").value = "";
  $("#p-form").reset();
  $("#form-title").textContent = "Add New Product";
  $("#btn-submit").textContent = "Save Product";
}

function editP(id) {
  const p = P.find(x => x.id === id);
  if (!p) return;
  $("#p-id").value = p.id;
  $("#p-n").value = p.n;
  $("#p-p").value = p.p;
  $("#p-c").value = p.c;
  $("#p-tag").value = p.tag || "";
  $("#p-d").value = p.d;
  
  $("#form-title").textContent = "Edit Product #" + id;
  $("#btn-submit").textContent = "Update Product";
  window.scrollTo({ top: $("#p-form").offsetTop - 80, behavior: 'smooth' });
}

function deleteP(id) {
  if (confirm("Are you sure you want to delete this product?")) {
    P = P.filter(x => x.id !== id);
    render();
    toast("Product removed");
  }
}

$("#p-form").onsubmit = e => {
  e.preventDefault();
  const id = $("#p-id").value;
  const n = $("#p-n").value;
  const p = parseFloat($("#p-p").value);
  const c = $("#p-c").value;
  const tag = $("#p-tag").value;
  const d = $("#p-d").value;

  if (id) {
    /* Update Existing */
    const index = P.findIndex(x => x.id == id);
    if (index !== -1) {
      P[index] = { ...P[index], n, p, c, tag, d };
      toast("Product updated!");
    }
  } else {
    /* Create New */
    const newId = P.length ? Math.max(...P.map(x => x.id)) + 1 : 1;
    const bgs = ["#eaf1ff", "#e7f8f1", "#fff2e5", "#f3ebff"];
    const bg = bgs[Math.floor(Math.random() * bgs.length)];
    P.push({ id: newId, n, p, c, tag, d, bg });
    toast("New product added!");
  }

  resetForm();
  render();
};

function exportJSON() {
  const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(P, null, 2));
  const a = document.createElement('a');
  a.setAttribute("href", dataStr);
  a.setAttribute("download", "products.json");
  document.body.appendChild(a);
  a.click();
  a.remove();
}

checkAuth();
render();
</script>
</body>
</html>
